[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confluence-markdown-mcp"
version = "1.0.0"
description = "Kiro Power and MCP server for bidirectional Markdown-to-Confluence sync"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "markdownify>=0.14.0",
    "markdown>=3.6",
    "python-frontmatter>=1.1.0",
    "python-dotenv>=1.1.0",
    "mcp[cli]>=1.0.0",
]

[project.scripts]
confluence-markdown-mcp = "confluence_markdown_mcp:main"
